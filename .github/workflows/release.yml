name: Release game
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: game-release-${{ github.ref }}
  cancel-in-progress: false
env:
  GAME_DIR: output/game
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax and stage allowlisted assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --check game.js
          node --check playroom-sdk.js
          node --check scripts/stage-release.mjs
          node scripts/stage-release.mjs
      - name: Check release version and resolve artifact directory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const workspace = path.resolve(process.env.GITHUB_WORKSPACE);
          const root = path.resolve(workspace, process.env.GAME_DIR);
          if (!root.startsWith(workspace + path.sep)) throw Error('GAME_DIR must be a directory inside the game repository');
          const m = JSON.parse(fs.readFileSync(path.join(root, 'game.json'), 'utf8'));
          if ('v' + m.version !== process.env.RELEASE_TAG) throw Error('Tag and manifest version differ');
          if (/[\r\n]/.test(root)) throw Error('Invalid GAME_DIR');
          fs.appendFileSync(process.env.GITHUB_ENV, `GAME_PATH=${root}\n`);
          JS
      - name: Install latest Playroom validation tools
        run: |
          PLATFORM_DIR="$RUNNER_TEMP/playroom-platform-tools"
          git clone --depth 1 --branch main --single-branch https://github.com/TommyLamm/playroom-platform.git "$PLATFORM_DIR"
          npm ci --prefix "$PLATFORM_DIR"
      - name: Pack and fully validate release ZIP
        run: |
          PLATFORM_DIR="$RUNNER_TEMP/playroom-platform-tools"
          GAME_ZIP="$RUNNER_TEMP/playroom-release/game.zip"
          cd "$PLATFORM_DIR"
          npm run game:pack -- "$GAME_PATH" "$GAME_ZIP"
          npm run game:validate -- "$GAME_ZIP"
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          GAME_ZIP="$RUNNER_TEMP/playroom-release/game.zip"
          gh release create "$RELEASE_TAG" "$GAME_ZIP" --repo "$RELEASE_REPO" --verify-tag --title "DUST//REIGN $RELEASE_TAG" --notes-file RELEASE.md
